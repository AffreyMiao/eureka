<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到ideashow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        h1 {
            margin-top: 50px;
            color: #333;
        }
        .button-container {
            margin-top: 30px;
        }
        button {
            display: block;
            width: 80%;
            max-width: 300px;
            margin: 10px auto;
            padding: 15px;
            font-size: 16px;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>欢迎来到ideashow</h1>
    <div class="button-container">
        <button onclick="alert('绿堤守望法律公益项目')">绿堤守望法律公益项目</button>
        <button onclick="alert('土耳其本地化制造')">土耳其本地化制造</button>
        <button onclick="alert('衡量两个坐标点之间费用指标')">衡量两个坐标点之间费用指标</button>
    </div>
</body>
</html>
