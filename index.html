<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到Eureka</title>
    <link rel="stylesheet" href="styles.css">
</head>
    
<body>
    <div id="passwordOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
">
    <div style="
        background: white;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
    ">
        <h3>请输入访问密码</h3>
        <input type="password" id="passwordInput" style="
            padding: 10px;
            margin: 10px 0;
            width: 80%;
        ">
        <button onclick="checkPassword()" style="
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        ">验证</button>
        <p id="errorMsg" style="color: red; display: none;">密码错误！</p>
    </div>
</div>

    <div class="container">
        <h1>欢迎来到Eureka</h1>
        <p>请选择一个功能开始使用：</p>
        
        <div class="button-container">

             <a href="iCP-train.html" class="button">
                <span class="button-title">培训类NV值计算</span>
                <span class="button-description">按TDA发布的培训类NV值规程制作，时间2018年6月7日。</span>
            </a>
            <a href="weekly-report.html" class="button">
                <span class="button-title">工作周报</span>
                <span class="button-description">上周工作汇报。</span>
            </a>
            <a href="docs/blog.html" class="button">
                <span class="button-title">进入我的博客</span>
                <span class="button-description">简单的经历。</span>
            </a>
            <a href="GPEST-viewer.html" class="button">
                <span class="button-title">国别市场速查</span>
                <span class="button-description">以GPEST研究法系统介绍目标市场。</span>
            </a>

            <a href="standard-comparison.html" class="button">
                <span class="button-title">标准对比</span>
                <span class="button-description">比较不同标准之间的差异。</span>
            </a>
            
            <a href="cost-estimation-mro.html" class="button">
                <span class="button-title">成本测算模型-MRO</span>
                <span class="button-description">计算MRO相关成本。</span>
            </a>
            
        </div>
    </div>
</body>

    <script>
    function checkPassword() {
        const password = "eureka123"; // 修改为您想要的密码
        const input = document.getElementById('passwordInput').value;
        
        if (input === password) {
            document.getElementById('passwordOverlay').style.display = 'none';
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }
    // 支持回车键验证
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkPassword();
    });
</script>
    
</html>
